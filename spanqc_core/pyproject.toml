[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spanqc-core"
version = "0.1.0"
description = "SPANQC deterministic rule engine and Tech Pub wiring diagram verifier"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "openpyxl>=3.1",
    "pillow>=10.4",
    "pytest>=8.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["spanqc_core*"]

