services:
  # ============================================================================
  # 1. Next.js 16 Web Application Frontend & Job Bridge
  # ============================================================================
  web:
    container_name: spanqc-web
    build:
      context: .
      dockerfile: Dockerfile.web
    image: spanqc-web:latest
    restart: unless-stopped
    ports:
      # Map HTTP port 80 directly to Next.js port 3000 for direct IP access
      - "80:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/data/dev.db
      - AUTH_SECRET=${AUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost}
      - PYTHON_SERVICE_URL=http://core:8000
      - SPANQC_PYTHON_SERVICE_URL=http://core:8000
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
      - NEXT_PUBLIC_RAZORPAY_KEY_ID=${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - SPANQC_INTERNAL_SERVICE_SECRET=${SPANQC_INTERNAL_SERVICE_SECRET:-}
    volumes:
      - spanqc_data:/app/data
      - spanqc_storage:/app/storage
    depends_on:
      core:
        condition: service_healthy
    networks:
      - spanqc-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ============================================================================
  # 2. Python FastAPI Core Microservice (Transcribes & Evaluates Rules)
  # ============================================================================
  core:
    container_name: spanqc-core
    build:
      context: .
      dockerfile: Dockerfile.core
    image: spanqc-core:latest
    restart: unless-stopped
    expose:
      # Internal only - not exposed to the public internet
      - "8000"
    environment:
      - PORT=8000
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SPANQC_MODEL=${SPANQC_MODEL:-claude-sonnet-4-6}
    networks:
      - spanqc-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  # Persistent volume for SQLite database
  spanqc_data:
    name: spanqc_prod_data
  # Persistent volume for uploaded wiring diagrams
  spanqc_storage:
    name: spanqc_prod_storage

networks:
  spanqc-network:
    name: spanqc_prod_network
    driver: bridge
