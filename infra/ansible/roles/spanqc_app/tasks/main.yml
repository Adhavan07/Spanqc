---
- name: Create SpanQC application directory
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0755'

- name: Sync application files to remote server
  synchronize:
    src: "{{ playbook_dir }}/../../"
    dest: "{{ app_dir }}/"
    delete: false
    recursive: true
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=node_modules"
      - "--exclude=.next"
      - "--exclude=.venv"
      - "--exclude=*.pyc"
      - "--exclude=__pycache__"
      - "--exclude=*.zip"
      - "--exclude=*.db*"
      - "--exclude=infra/terraform/.terraform"
      - "--exclude=infra/terraform/*.tfstate*"
      - "--exclude=.env*"

- name: Fix ownership of deployed application files
  file:
    path: "{{ app_dir }}"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    recurse: true

- name: Render production environment configuration (.env)
  template:
    src: .env.j2
    dest: "{{ app_dir }}/.env"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0600'

- name: Ensure docker-entrypoint.sh is executable
  file:
    path: "{{ app_dir }}/docker-entrypoint.sh"
    mode: '0755'

- name: Build and launch Docker Compose services
  command: docker compose up -d --build --remove-orphans
  args:
    chdir: "{{ app_dir }}"

- name: Wait for Next.js web service to be healthy on port 80
  wait_for:
    port: 80
    delay: 5
    timeout: 120

- name: Verify application HTTP response
  uri:
    url: "http://127.0.0.1/"
    status_code:
      - 200
      - 307
  register: web_health
  retries: 6
  delay: 5
  until: web_health.status is defined and (web_health.status == 200 or web_health.status == 307)
