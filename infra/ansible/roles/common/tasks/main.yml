---
- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install system essentials
  apt:
    name:
      - curl
      - wget
      - git
      - htop
      - ufw
      - ca-certificates
      - gnupg
      - lsb-release
      - rsync
    state: present

- name: Check if swapfile exists
  stat:
    path: /swapfile
  register: swap_stat

- name: Create 2GB swapfile for compilation headroom
  command: fallocate -l 2G /swapfile
  when: not swap_stat.stat.exists

- name: Set permissions on swapfile
  file:
    path: /swapfile
    owner: root
    group: root
    mode: '0600'

- name: Format swapfile
  command: mkswap /swapfile
  when: not swap_stat.stat.exists

- name: Enable swapfile
  command: swapon /swapfile
  when: not swap_stat.stat.exists
  ignore_errors: true

- name: Persist swapfile in /etc/fstab
  mount:
    name: none
    src: /swapfile
    fstype: swap
    opts: sw
    state: present
