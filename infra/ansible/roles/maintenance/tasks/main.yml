---
- name: Deploy docker-prune systemd service
  copy:
    dest: /etc/systemd/system/docker-prune.service
    mode: '0644'
    content: |
      [Unit]
      Description=SpanQC Weekly Docker Cache and Unused Images Cleanup
      After=docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/docker system prune -af --filter "until=168h"
      StandardOutput=journal
      StandardError=journal

- name: Deploy docker-prune systemd timer
  copy:
    dest: /etc/systemd/system/docker-prune.timer
    mode: '0644'
    content: |
      [Unit]
      Description=Run SpanQC Docker cache cleanup every Sunday at 3:00 AM

      [Timer]
      OnCalendar=Sun *-*-* 03:00:00
      Persistent=true
      RandomizedDelaySec=1800

      [Install]
      WantedBy=timers.target

- name: Reload systemd daemon
  systemd:
    daemon_reload: true

- name: Enable and start docker-prune timer
  systemd:
    name: docker-prune.timer
    enabled: true
    state: started
