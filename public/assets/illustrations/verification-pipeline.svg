<svg width="700" height="240" viewBox="0 0 700 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Pipeline Flow: Vector Parse -> Spatial Graph -> Deterministic Rule Engine -> Cryptographic Seal -->
  <g transform="translate(20, 30)">
    <!-- Stage 1 -->
    <rect width="135" height="180" rx="12" fill="#0C101A" stroke="#1B253B" stroke-width="1.5"/>
    <circle cx="67" cy="45" r="20" fill="rgba(0, 240, 255, 0.1)" stroke="#00F0FF" stroke-width="1.5"/>
    <path d="M60 45L65 50L75 40" stroke="#00F0FF" stroke-width="2" stroke-linecap="round"/>
    <text x="67" y="90" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1. Ingestion</text>
    <text x="67" y="112" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748B" text-anchor="middle">Vector PDF / DWG</text>
    <text x="67" y="128" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748B" text-anchor="middle">1200 DPI Raster</text>
    <text x="67" y="152" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#00F0FF" text-anchor="middle">SHA-256 SEAL</text>

    <!-- Connector Arrow 1 -->
    <path d="M142 90H168" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>

    <!-- Stage 2 -->
    <rect x="175" width="135" height="180" rx="12" fill="#0C101A" stroke="#1B253B" stroke-width="1.5"/>
    <circle cx="242" cy="45" r="20" fill="rgba(0, 102, 255, 0.1)" stroke="#0066FF" stroke-width="1.5"/>
    <path d="M236 45H248M242 39V51" stroke="#0066FF" stroke-width="2" stroke-linecap="round"/>
    <text x="242" y="90" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2. Netlist Graph</text>
    <text x="242" y="112" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748B" text-anchor="middle">Pin-to-Pin Conns</text>
    <text x="242" y="128" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748B" text-anchor="middle">Topology Map</text>
    <text x="242" y="152" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#0066FF" text-anchor="middle">SPATIAL OCR</text>

    <!-- Connector Arrow 2 -->
    <path d="M317 90H343" stroke="#0066FF" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>

    <!-- Stage 3 -->
    <rect x="350" width="135" height="180" rx="12" fill="#0C101A" stroke="#1B253B" stroke-width="1.5"/>
    <circle cx="417" cy="45" r="20" fill="rgba(139, 92, 246, 0.1)" stroke="#8B5CF6" stroke-width="1.5"/>
    <circle cx="417" cy="45" r="6" stroke="#8B5CF6" stroke-width="2"/>
    <text x="417" y="90" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3. Rules Engine</text>
    <text x="417" y="112" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748B" text-anchor="middle">IPC-620D Cl 2/3</text>
    <text x="417" y="128" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748B" text-anchor="middle">UL 508A Panels</text>
    <text x="417" y="152" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#8B5CF6" text-anchor="middle">64 STRICT RULES</text>

    <!-- Connector Arrow 3 -->
    <path d="M492 90H518" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>

    <!-- Stage 4 -->
    <rect x="525" width="135" height="180" rx="12" fill="#0C101A" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="592" cy="45" r="20" fill="rgba(16, 185, 129, 0.1)" stroke="#10B981" stroke-width="1.5"/>
    <path d="M585 45L590 50L600 40" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
    <text x="592" y="90" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4. Evidence Audit</text>
    <text x="592" y="112" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748B" text-anchor="middle">Sub-mm Bounding</text>
    <text x="592" y="128" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748B" text-anchor="middle">PDF & CSV Export</text>
    <text x="592" y="152" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#10B981" text-anchor="middle">LEAD SIGN-OFF</text>
