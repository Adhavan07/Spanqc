<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#1E293B"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="#06070A"/>
  <rect width="800" height="500" fill="url(#grid2)"/>

  <rect x="20" y="20" width="760" height="460" rx="8" stroke="#1B253B" stroke-width="1.5"/>
  <rect x="20" y="440" width="760" height="40" fill="#0C101A" stroke="#1B253B" stroke-width="1.5"/>
  <text x="35" y="464" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#64748B">DRAWING NO: MCC-VFD-01-REV2</text>
  <text x="300" y="464" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#64748B">480VAC 3-PHASE 60Hz</text>
  <text x="560" y="464" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#00F0FF">UL 508A SECTION 40.3</text>

  <!-- Power Incomer & Breaker CB1 -->
  <g transform="translate(60, 60)">
    <rect width="180" height="90" rx="6" fill="#0C101A" stroke="#334155" stroke-width="1.5"/>
    <text x="90" y="32" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">MAIN BREAKER CB-01</text>
    <text x="90" y="52" font-family="ui-monospace, monospace" font-size="10" fill="#94A3B8" text-anchor="middle">100A 3P 65kA SCCR</text>
    <text x="90" y="70" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#10B981" text-anchor="middle">✓ BUSBAR VERIFIED</text>
  </g>

  <!-- VFD Drive VFD-101 (Middle) -->
  <g transform="translate(320, 60)">
    <rect width="200" height="180" rx="6" fill="#0C101A" stroke="#334155" stroke-width="1.5"/>
    <text x="100" y="30" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">VFD INVERTER 15HP</text>
    <text x="100" y="48" font-family="ui-monospace, monospace" font-size="9" fill="#94A3B8" text-anchor="middle">ALLEN-BRADLEY PF525</text>
    <line x1="15" y1="60" x2="185" y2="60" stroke="#1E293B"/>

    <!-- Terminals L1 L2 L3 -->
    <text x="35" y="85" font-family="ui-monospace, monospace" font-size="10" fill="#94A3B8">L1 L2 L3 IN</text>
    <text x="35" y="115" font-family="ui-monospace, monospace" font-size="10" fill="#F97316">U V W OUT (MOTOR)</text>
    <text x="35" y="145" font-family="ui-monospace, monospace" font-size="10" fill="#FF3366">BRAKE CHOPPER BR+/-</text>
  </g>

  <!-- Major Finding: Missing Line Reactor / High SCCR Bounding Box -->
  <rect x="80" y="180" width="220" height="90" rx="6" fill="rgba(249, 115, 22, 0.08)" stroke="#F97316" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="90" y="190" width="85" height="18" rx="3" fill="#F97316"/>
  <text x="132" y="203" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">MAJOR QC FLAG</text>
  <text x="90" y="225" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#FDBA74">MISSING LINE REACTOR LR-1</text>
  <text x="90" y="242" font-family="ui-monospace, monospace" font-size="9" fill="#94A3B8">VFD SCCR degrades to 5kA without</text>
  <text x="90" y="256" font-family="ui-monospace, monospace" font-size="9" fill="#94A3B8">upstream impedance element.</text>

  <!-- Motor Terminal Block MT1 (Right) -->
  <g transform="translate(590, 60)">
    <rect width="150" height="180" rx="6" fill="#0C101A" stroke="#334155" stroke-width="1.5"/>
    <text x="75" y="32" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">TERMINAL MT-01</text>
    <text x="75" y="50" font-family="ui-monospace, monospace" font-size="9" fill="#94A3B8" text-anchor="middle">TO CONVEYOR MOTOR</text>
  </g>

  <!-- Power Lines -->
  <path d="M240 105H320" stroke="#00F0FF" stroke-width="2.5"/>
  <path d="M520 150H590" stroke="#F97316" stroke-width="2.5"/>

  <!-- Lower Schematic Zone: Control Circuit 24VDC -->
  <rect x="60" y="300" width="680" height="110" rx="6" fill="#0C101A" stroke="#1B253B" stroke-width="1.5"/>
  <text x="80" y="325" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#FFFFFF">CONTROL CIRCUIT 24VDC SAFETY INTERLOCK</text>
  <line x1="80" y1="335" x2="720" y2="335" stroke="#1E293B"/>
  <text x="80" y="360" font-family="ui-monospace, monospace" font-size="10" fill="#10B981">✓ E-STOP CONTACTS DUAL CHANNEL CAT 4 PLe VERIFIED</text>
  <text x="80" y="385" font-family="ui-monospace, monospace" font-size="10" fill="#64748B">PILZ PNOZ S4 SAFETY RELAY K1 / RESET PUSHBUTTON S1</text>
</svg>
