<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#1E293B"/>
    </pattern>
  </defs>

  <!-- Background Blueprint Canvas -->
  <rect width="800" height="500" fill="#06070A"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Title Block Border -->
  <rect x="20" y="20" width="760" height="460" rx="8" stroke="#1B253B" stroke-width="1.5"/>
  <rect x="20" y="440" width="760" height="40" fill="#0C101A" stroke="#1B253B" stroke-width="1.5"/>
  <text x="35" y="464" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#64748B">DRAWING NO: WH-402-B777X</text>
  <text x="280" y="464" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#64748B">REV: D.4</text>
  <text x="380" y="464" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#64748B">ZONE: B3-D4</text>
  <text x="560" y="464" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#00F0FF">IPC/WHMA-A-620 CLASS 3</text>

  <!-- Connector J1 Block (Left) -->
  <g transform="translate(60, 80)">
    <rect width="100" height="280" rx="6" fill="#0C101A" stroke="#334155" stroke-width="1.5"/>
    <text x="50" y="30" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">J1</text>
    <text x="50" y="45" font-family="ui-monospace, monospace" font-size="9" fill="#94A3B8" text-anchor="middle">MS3470L14-19P</text>
    <line x1="10" y1="55" x2="90" y2="55" stroke="#1E293B"/>

    <!-- Pins -->
    <circle cx="85" cy="80" r="4" fill="#0066FF"/>
    <text x="25" y="84" font-family="ui-monospace, monospace" font-size="11" fill="#E2E8F0">PIN 01</text>

    <circle cx="85" cy="130" r="4" fill="#FF3366"/>
    <text x="25" y="134" font-family="ui-monospace, monospace" font-size="11" fill="#E2E8F0">PIN 02</text>

    <circle cx="85" cy="180" r="4" fill="#F97316"/>
    <text x="25" y="184" font-family="ui-monospace, monospace" font-size="11" fill="#E2E8F0">PIN 03</text>

    <circle cx="85" cy="230" r="4" fill="#0066FF"/>
    <text x="25" y="234" font-family="ui-monospace, monospace" font-size="11" fill="#E2E8F0">PIN 04</text>
  </g>

  <!-- Terminal Block TB1 (Right) -->
  <g transform="translate(640, 80)">
    <rect width="100" height="280" rx="6" fill="#0C101A" stroke="#334155" stroke-width="1.5"/>
    <text x="50" y="30" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">TB1</text>
    <text x="50" y="45" font-family="ui-monospace, monospace" font-size="9" fill="#94A3B8" text-anchor="middle">RELAY FEED</text>
    <line x1="10" y1="55" x2="90" y2="55" stroke="#1E293B"/>

    <!-- Terminals -->
    <circle cx="15" cy="80" r="4" fill="#0066FF"/>
    <text x="35" y="84" font-family="ui-monospace, monospace" font-size="11" fill="#E2E8F0">TERM 1</text>

    <circle cx="15" cy="130" r="4" fill="#FF3366"/>
    <text x="35" y="134" font-family="ui-monospace, monospace" font-size="11" fill="#E2E8F0">TERM 2</text>

    <circle cx="15" cy="180" r="4" fill="#F97316"/>
    <text x="35" y="184" font-family="ui-monospace, monospace" font-size="11" fill="#E2E8F0">TERM 3</text>

    <circle cx="15" cy="230" r="4" fill="#0066FF"/>
    <text x="35" y="234" font-family="ui-monospace, monospace" font-size="11" fill="#E2E8F0">TERM 4</text>
  </g>

  <!-- Wire Net 1: W101 20 AWG RED (Compliant) -->
  <path d="M145 160H655" stroke="#10B981" stroke-width="2.5" stroke-dasharray="none"/>
  <rect x="330" y="148" width="130" height="22" rx="4" fill="#0C101A" stroke="#10B981" stroke-width="1"/>
  <text x="395" y="163" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#10B981" text-anchor="middle">W101 20 AWG RED</text>

  <!-- Wire Net 2: W102 (CRITICAL DEFECT: MISSING GAUGE CALLOUT) -->
  <path d="M145 210H655" stroke="#FF3366" stroke-width="2.5"/>
  <!-- Highlight Bounding Box -->
  <rect x="280" y="194" width="230" height="32" rx="6" fill="rgba(255, 51, 102, 0.12)" stroke="#FF3366" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="290" y="200" width="100" height="20" rx="3" fill="#FF3366"/>
  <text x="340" y="214" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">CRITICAL DEFECT</text>
  <text x="405" y="214" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#FF85A1">W102 BLU (NO AWG)</text>

  <!-- Wire Net 3: W103 (MAJOR FLAG: UNDERSIZED 22 AWG ON 15A CIRCUIT) -->
  <path d="M145 260H655" stroke="#F97316" stroke-width="2.5"/>
  <rect x="310" y="248" width="170" height="24" rx="4" fill="rgba(249, 115, 22, 0.12)" stroke="#F97316" stroke-width="1.5"/>
  <text x="395" y="264" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#F97316" text-anchor="middle">W103 22 AWG (15A EXCEEDED)</text>

  <!-- Wire Net 4: W104 GND (Compliant) -->
  <path d="M145 310H655" stroke="#00F0FF" stroke-width="2"/>
  <rect x="340" y="300" width="110" height="20" rx="4" fill="#0C101A" stroke="#1B253B" stroke-width="1"/>
  <text x="395" y="314" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#00F0FF" text-anchor="middle">W104 18 AWG BLK</text>
</svg>
