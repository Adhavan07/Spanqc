<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid3" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#1E293B"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="#06070A"/>
  <rect width="800" height="500" fill="url(#grid3)"/>

  <rect x="20" y="20" width="760" height="460" rx="8" stroke="#1B253B" stroke-width="1.5"/>
  <rect x="20" y="440" width="760" height="40" fill="#0C101A" stroke="#1B253B" stroke-width="1.5"/>
  <text x="35" y="464" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#64748B">DRAWING NO: TB-200-EV-HV</text>
  <text x="280" y="464" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#64748B">800V DC BUS RELAY</text>
  <text x="560" y="464" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#10B981">✓ 100% COMPLIANT (0 DEFECTS)</text>

  <!-- High Voltage Contactor K1 (Left) -->
  <g transform="translate(80, 80)">
    <rect width="180" height="260" rx="6" fill="#0C101A" stroke="#10B981" stroke-width="1.5"/>
    <text x="90" y="32" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">MAIN CONTACTOR K1</text>
    <text x="90" y="50" font-family="ui-monospace, monospace" font-size="9" fill="#94A3B8" text-anchor="middle">GIGAVAC GX14 800V 400A</text>
    <line x1="15" y1="62" x2="165" y2="62" stroke="#1E293B"/>

    <circle cx="150" cy="100" r="4" fill="#10B981"/>
    <text x="30" y="104" font-family="ui-monospace, monospace" font-size="11" fill="#E2E8F0">A1+ (HV BUS+)</text>

    <circle cx="150" cy="160" r="4" fill="#10B981"/>
    <text x="30" y="164" font-family="ui-monospace, monospace" font-size="11" fill="#E2E8F0">A2- (INVERTER+)</text>

    <circle cx="150" cy="220" r="4" fill="#00F0FF"/>
    <text x="30" y="224" font-family="ui-monospace, monospace" font-size="11" fill="#E2E8F0">AUX AUXILIARY</text>
  </g>

  <!-- Pre-Charge Relay K2 (Right) -->
  <g transform="translate(540, 80)">
    <rect width="180" height="260" rx="6" fill="#0C101A" stroke="#10B981" stroke-width="1.5"/>
    <text x="90" y="32" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">PRECHARGE RELAY K2</text>
    <text x="90" y="50" font-family="ui-monospace, monospace" font-size="9" fill="#94A3B8" text-anchor="middle">TE HIGH VOLTAGE EV200</text>
    <line x1="15" y1="62" x2="165" y2="62" stroke="#1E293B"/>

    <circle cx="30" cy="100" r="4" fill="#10B981"/>
    <text x="50" y="104" font-family="ui-monospace, monospace" font-size="11" fill="#E2E8F0">IN FEED</text>

    <circle cx="30" cy="160" r="4" fill="#10B981"/>
    <text x="50" y="164" font-family="ui-monospace, monospace" font-size="11" fill="#E2E8F0">RESISTOR R1</text>

    <circle cx="30" cy="220" r="4" fill="#00F0FF"/>
    <text x="50" y="224" font-family="ui-monospace, monospace" font-size="11" fill="#E2E8F0">12V COIL</text>
  </g>

  <!-- Connective Wires (All Verified Green) -->
  <path d="M260 180H540" stroke="#10B981" stroke-width="2.5"/>
  <rect x="340" y="165" width="120" height="26" rx="4" fill="#0C101A" stroke="#10B981" stroke-width="1"/>
  <text x="400" y="182" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#10B981" text-anchor="middle">✓ 2/0 AWG ORANGE</text>

  <rect x="310" y="240" width="180" height="60" rx="6" fill="rgba(16, 185, 129, 0.08)" stroke="#10B981" stroke-width="1"/>
  <text x="400" y="262" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">PRE-CHARGE RESISTOR</text>
  <text x="400" y="282" font-family="ui-monospace, monospace" font-size="10" fill="#94A3B8" text-anchor="middle">47Ω 50W CERAMIC WIREWOUND</text>
</svg>
